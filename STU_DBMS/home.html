<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Information</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<nav class="navbar">
    <a href="#" class="navbar-brand">Student Information</a>

    <div class="nav-links">
        <a href="#" onclick="openModal(); return false;">Add</a>
        <a href="#">Remove</a>
        <a href="#" onclick="viewStudent(); return false;">View</a>
    </div>
</nav>

<div class="container mt-4">
    <h3>Student Information DBMS</h3>
    <div id="view" class="mt-4"></div>
</div>

<!-- Modal Popup for Add Student -->
<div id="addModal" class="modal-overlay">
    <div class="modal-box">
        <div class="modal-header">
            <h4>Add Student</h4>
            <button type="button" class="close-btn" onclick="closeModal()">&times;</button>
        </div>
        <form id="studentForm" onsubmit="addStudent(event)">
            <div class="form-group">
                <label for="name">Name:</label>
                <input type="text" id="name" class="form-control" required>
            </div>
            <div class="form-group">
                <label for="age">Age:</label>
                <input type="number" id="age" class="form-control" required>
            </div>
            <div class="form-group">
                <label for="rollNo">Roll Number:</label>
                <input type="text" id="rollNo" class="form-control" required>
            </div>
            <div class="form-group">
                <label for="class">Class:</label>
                <input type="text" id="class" class="form-control" required>
            </div>
            <div class="form-group">
                <label for="section">Section:</label>
                <input type="text" id="section" class="form-control" required>
            </div>
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" class="form-control" required>
            </div>
            <div class="form-group">
                <label for="phone">Phone:</label>
                <input type="tel" id="phone" class="form-control" required>
            </div>
            <div class="form-group">
                <label for="address">Address:</label>
                <textarea id="address" class="form-control" required></textarea>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                <button type="submit" class="btn btn-primary">Add Student</button>
            </div>
        </form>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>

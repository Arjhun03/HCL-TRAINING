<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Among Us - Login</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0b0e14;
            font-family: Arial, sans-serif;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

       
        .login-box {
            background-color: #1a1e29;
            border: 4px solid #333d52;
            border-radius: 16px;
            padding: 30px;
            width: 320px;
            text-align: center;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
        }

        h1 {
            color: #ff3838;
            font-size: 28px;
            letter-spacing: 3px;
            margin-bottom: 20px;
            text-shadow: 2px 2px #000;
        }

        
        .crewmate {
            position: relative;
            width: 60px;
            height: 75px;
            background-color: #c51111;
            border: 4px solid #000;
            border-radius: 30px 30px 10px 10px;
            margin: 0 auto 20px;
        }

        

        
        .crewmate::after {
            content: "";
            position: absolute;
            width: 34px;
            height: 22px;
            background-color: #71d3e2;
            border: 4px solid #000;
            border-radius: 12px;
            right: 4px;
            top: 16px;
        }

       
        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }

        label {
            display: block;
            font-size: 13px;
            color: #aaa;
            margin-bottom: 5px;
        }

        input {
            width: 100%;
            padding: 10px;
            background-color: #0b0e14;
            border: 2px solid #333d52;
            border-radius: 8px;
            color: white;
            font-size: 14px;
            outline: none;
        }

        input:focus {
            border-color: #ff3838;
        }

       
        button {
            width: 100%;
            padding: 12px;
            background-color: #ff3838;
            color: white;
            font-size: 16px;
            font-weight: bold;
            border: 3px solid #000;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover {
            background-color: #e02828;
        }
    </style>
</head>
<body>

    <div class="login-box">
        <h1>AMONG US</h1>

        <div class="crewmate"></div>

        <form action="#" method="POST">
            <div class="form-group">
                <label for="username">CREWMATE NAME</label>
                <input type="text" id="username" name="username" placeholder="Enter nickname" required>
            </div>

            <div class="form-group">
                <label for="room-code">ROOM CODE / PASSWORD</label>
                <input type="password" id="room-code" name="room_code" placeholder="Enter code" autocomplete="current-password" required>
            </div>

            <button type="submit">JOIN GAME</button>
        </form>
    </div>

    <script src="AMG_script.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login form </title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="container">
    <h1>LOGIN</h1>
        <form method="POST">
            <table id="form-table">
                <tbody>
                <tr>
                    <td><label for="fname"> First name</label></td>
                    <td><input type="text" id="fname" name="fname" placeholder="Enter Name"></td>

                </tr>
                <tr>
                    <td><label for="email">Email</label></td>
                    <td><input type="email" id="email" name="email"  placeholder="Enter Email"></td>
                </tr>
                <tr>
                    <td>DOB</td>
                    <td><input type="date" id="dob" name="dob"></td>
                </tr>
                <tr>
                    <td>Gender</td>
                    <td>
                        <input type="radio" id="male" name="gender" value="male">
                        <label for="male">Male</label>
                    </td>

                    <td>
                        <input type="radio" id="female" name="gender" value="female">
                        <label for="female">Female</label>
                    </td>
                </tr>
                <tr>
                    <td><input type="checkbox" id="check"></td>
                    <td><label for="check">Accept terms and conditions</label></td>
                </tr>
                <tr>
                    <td>Amoung us login</td>
                    <td><a href="amg_us_login.html">amoung us login</a></td>
                </tr>
                <tr>
                    <td>Among Us Replica</td>
                    <td><a href="amg_replica.html">Among Us Replica</a></td>
                </tr>
                 <tr>
                    <td><button type="submit">Submit</button></td>
                    <td ><button type="reset">Reset</button></td>
                </tr>

                </tbody>
            </table>
        </form>
    </main>
</body>
</html>
